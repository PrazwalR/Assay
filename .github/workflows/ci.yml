name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --report summary --no-match-coverage "(script|test)"

      # Fuzz and invariant gas is a function of run count and seed, and the ci profile runs
      # more fuzz iterations than the default one. Snapshotting them can never be stable, so
      # the snapshot covers deterministic tests only. Keep this filter identical to the one
      # used locally or the check will drift again.
      - name: Gas snapshot
        run: |
          forge snapshot --check --no-match-test "testFuzz|invariant" \
            || (echo "gas changed; regenerate with: forge snapshot --no-match-test \"testFuzz|invariant\"" && exit 1)

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Slither
        run: |
          pip install slither-analyzer
          slither . --config-file slither.config.json

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  calibration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calibration
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install pinned dependencies
        run: uv venv .venv && uv pip install --python .venv/bin/python -r requirements.lock

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q
