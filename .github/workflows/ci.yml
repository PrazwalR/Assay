name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not floating. foundry.toml requires the deployed bytecode to reproduce
          # byte-for-byte from a checkout because the hook lives at a mined CREATE2 address;
          # a moving compiler toolchain is at odds with that, and .gas-snapshot is only
          # meaningful against the version that produced it.
          version: v1.5.1

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      # test/fork excluded: it forks live Base Sepolia state, which the rest of this job
      # cannot depend on. A flaky public RPC would fail CI for a reason unrelated to code
      # correctness, and its gas cost isn't stable to snapshot since it depends on real,
      # changing on-chain state. It runs as its own non-blocking job below instead.
      - name: Test
        run: forge test -vvv --no-match-path "test/fork/*"

      # Invariants run separately from the unit suite: they are slower, and a failure here
      # means a property broke across a sequence rather than in a single case, which is worth
      # seeing as its own line in the log.
      - name: Invariants
        run: forge test --match-path "test/invariant/*" -vv

      # Gas tests are excluded: coverage instrumentation inflates gas, so their assertions
      # measure the instrumented build rather than the shipped one. They gate in the test
      # step instead. Fork tests are excluded for the same reason as the Test step above --
      # network access, not instrumentation, but the same "don't run here" conclusion.
      #
      # --no-match-contract, not --no-match-path: forge coverage does not honor path-based
      # exclusion the way `forge test` does -- verified directly, the excluded files still
      # ran under instrumentation and both failure modes above showed up here. Contract-name
      # exclusion actually works.
      - name: Coverage
        run: |
          forge coverage --report lcov --report-file lcov.info             --no-match-coverage "(script|test)" --no-match-contract "HookOverheadTest|LiveBaseSepoliaForkTest"
          python3 - <<'CHECK'
          import re, sys
          hit = found = 0
          for line in open("lcov.info"):
              if line.startswith("LH:"): hit += int(line[3:])
              elif line.startswith("LF:"): found += int(line[3:])
          pct = 100.0 * hit / found if found else 0.0
          print(f"line coverage: {pct:.2f}% ({hit}/{found})")
          if pct < 95.0:
              sys.exit(f"coverage {pct:.2f}% is below the 95% floor")
          CHECK

      # Fuzz and invariant gas is a function of run count and seed, and the ci profile runs
      # more fuzz iterations than the default one. Snapshotting them can never be stable, so
      # the snapshot covers deterministic tests only. Fork tests are excluded too: their gas
      # depends on real, changing on-chain state, which is exactly the same instability
      # problem. Keep this filter identical to the one used locally or the check will drift
      # again.
      - name: Gas snapshot
        run: |
          forge snapshot --check --no-match-test "testFuzz|invariant" --no-match-path "test/fork/*" \
            || (echo "gas changed; regenerate with: forge snapshot --no-match-test \"testFuzz|invariant\" --no-match-path \"test/fork/*\"" && exit 1)

  # Runs against live Base Sepolia state rather than a local deployment -- the strongest
  # available check that the deployed bytecode still agrees with this checkout, but at the
  # cost of depending on a third-party RPC's uptime. Separate and non-blocking so a public
  # RPC hiccup surfaces as a visible, ignorable line rather than failing every PR.
  fork:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      - name: Fork test (live Base Sepolia)
        run: forge test --match-path "test/fork/*" -vv
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL || 'https://sepolia.base.org' }}

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not floating. foundry.toml requires the deployed bytecode to reproduce
          # byte-for-byte from a checkout because the hook lives at a mined CREATE2 address;
          # a moving compiler toolchain is at odds with that, and .gas-snapshot is only
          # meaningful against the version that produced it.
          version: v1.5.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Slither
        run: |
          pip install slither-analyzer==0.11.6
          slither . --config-file slither.config.json --fail-medium

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  calibration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calibration
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install pinned dependencies
        run: uv venv .venv && uv pip install --python .venv/bin/python -r requirements.lock

      # The Python computes the captureShareBps that gets deployed, so it is held to the
      # same bar as the Solidity rather than only being run.
      - name: Lint
        run: uvx ruff check . --exclude .venv

      - name: Format
        run: uvx ruff format --check . --exclude .venv

      - name: Dependency audit
        run: uvx pip-audit -r requirements.lock --progress-spinner off

      - name: Tests
        run: .venv/bin/python -m pytest tests/ -q
